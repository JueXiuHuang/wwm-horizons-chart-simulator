<style>
/* Layout: mechanic index on the left, the 3D arena as the working surface, the how-to sheet beside it on wide screens. */

}

:root[data-theme="dark"] { color-scheme: dark; }

[hidden] { display: none !important; }

.wrap { max-width: 1560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }

.touch button { width: 58px; height: 58px; border-radius: 50%; background: rgba(9,13,15,.7); border: 1px solid rgba(255,255,255,.28); color: var(--hud-fg); font-weight: 700; font-size: 15px; touch-action: manipulation; }
.touch button:active { background: rgba(242,193,78,.4); }
@media (max-width: 640px) {
  .bars { width: 40%; } .cast { width: 52%; left: auto; right: 10px; transform: none; top: 44px; }
  .caption { bottom: 8px; padding: 6px 10px; } .caption .say { font-size: 13px; } .caption .tip { font-size: 12px; }

}

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn:hover { background: var(--panel2); }
.btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold); }
.controls .spacer { flex: 1; }
.controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.controls select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.keys { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel); color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.sheet .brief { font-size: 16px; font-weight: 500; margin: 0 0 12px; }

.kbtn { font-family: var(--f-mono); font-size: 13px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; background: var(--panel2); padding: 5px 8px; cursor: pointer; }
.kbtn.empty { color: var(--muted); }
.kbtn[data-capturing="true"] { border-color: var(--gold); color: var(--gold); font-family: var(--f-body); }

@media (max-width: 480px) { .kgrid { grid-template-columns: minmax(0, 1fr) 84px 84px; } }
.foot { font-size: 12px; color: var(--muted); margin-top: 18px; max-width: 72ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">

<script>
/*SIM-START*/
const SIM = (() => {
'use strict';
const AR = 19.5, SPEED = 6, U_MAX = 9, U_ACC = 18, JUMP_V = 11, GRAV = 20, TETHER_MAX = 18, DEFLECT_WIN = 0.7;

const v = (x, z) => ({ x, z });
const add = (a, b) => v(a.x + b.x, a.z + b.z);
const sub = (a, b) => v(a.x - b.x, a.z - b.z);
const mul = (a, k) => v(a.x * k, a.z * k);
const dot = (a, b) => a.x * b.x + a.z * b.z;
const len = a => Math.hypot(a.x, a.z);
const norm = a => { const l = len(a); return l > 1e-6 ? v(a.x / l, a.z / l) : v(0, 0); };
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const perp = a => v(-a.z, a.x);
const cp = a => v(a.x, a.z);
const clamp01 = x => Math.max(0, Math.min(1, x));
function polar(r, deg) { const a = deg * Math.PI / 180; return v(r * Math.cos(a), -r * Math.sin(a)); }
function angOf(p) { return Math.atan2(-p.z, p.x) * 180 / Math.PI; }
function segInfo(p, a, b) {
  const ab = sub(b, a), L2 = dot(ab, ab);
  const t = L2 ? clamp01(dot(sub(p, a), ab) / L2) : 0;
  return { d: dist(p, add(a, mul(ab, t))), t };
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ROLE = ['you', 'tank', 'melee', 'melee', 'melee', 'ranged', 'ranged', 'melee', 'healer', 'healer'];
const MECHS = [];
const def = m => MECHS.push(m);

function create(mech, mode, seed) {
  const w = {
    mech, mode, seed, t: 0, rnd: mulberry32(seed || 1),
    players: [], umbrellas: [], tgs: [], orbs: [], cages: [], swords: [], fields: [], markers: [], fx: [], tethers: [],
    dome: null, vortex: null, clone: null, arena: mech.phase === 1 ? 'wayfarer' : 'peng',
    boss: { pos: v(0, 0), shield: 0, name: mech.phase === 1 ? '天涯客' : '鵬' },
    cast: null, caption: null, bars: [], msg: null, queue: [], result: null, f: {}, uid: 1,
  };
  for (let i = 1; i <= 10; i++) w.players.push({
    id: i, role: ROLE[i - 1], you: i === 1, ai: !(i === 1 && mode === 'play'),
    pos: v(0, 0), home: v(0, 0), y: 0, vy: 0, alive: true, hp: 100, riding: null, electrified: false, orb: null,
    exhausted: false, goal: null, ram: false, move: null, steer: null, kb: null, deflectT: -99, hits: 0, cage: null, st: {}, death: '',
  });
  if (mech.phase === 2) w.orbs = [90, 210, 330].map(a => ({ pos: polar(15, a), holder: null }));
  mech.setup(w);

    at(w, 19.5, () => win(w, '成功躲過所有紅圈！'));
  },
  ai(w, p) {
    if (p.id !== 1) return;
    const u = w.umbrellas[0]; if (!u) return;
    if (!p.riding) { walkTo(p, u.pos); if (dist(p.pos, u.pos) < 1.3) act(w, p, 'interact', u); return; }
    p.goal = dodgeGoal(w, u, true); p.ram = false;
  },
  update(w) { if (w.umbrellas.some(u => !u.alive)) fail(w, '傘被紅圈擊中：全場傷害並疊加「傷害降低」'); },
});

function unbound(id, zh, en, n, src) {
  def({
    id, phase: 1, zh, en,
    brief: `BOSS 生成 ${n} 把旋轉傘並放出大量紅圈，${n} 名隊員騎傘躲避；被摧毀兩把就團滅。`,
    steps: [`BOSS 在場上生成 ${n} 把旋轉傘，並放出大量紅圈。`, `派 ${n} 名隊員各騎一把傘。`, '持續移動躲紅圈，不要讓傘被打到。', '只要有兩把傘被摧毀就會團滅。', '技巧：貼著場邊跑、要停就卡牆；傘上的特殊技能用完會短暫無法操作，不建議用。'],
    fail: '兩把傘被摧毀：團滅。',
    task: `你騎其中一把傘（另外 ${n - 1} 把由隊友負責），撐過紅圈攻勢。`,
    src,
    setup(w) {
      formation(w, 6);
      at(w, 0.3, () => { cast(w, zh, en, 0.3, 1.8); say(w, `BOSS 生成 ${n} 把旋轉傘`, `${n} 名隊員各自上傘`); });
      at(w, 1.8, () => {
        for (let i = 0; i < n; i++) w.umbrellas.push(mkUmb(w, polar(3.6, -90 + i * 36), true));
        w.bars = [{ label: '被摧毀的傘', val: () => w.umbrellas.filter(u => !u.alive).length, max: 2, color: 'red', fmt: 'n/2' }];
      });
      at(w, 2.8, () => say(w, '大量紅圈落下', '兩把傘被摧毀就團滅'));
      redRain(w, 3.5, 17, 0.8, 1);
      at(w, 19.5, () => win(w, '所有傘都撐過紅圈攻勢！'));
    },
    ai(w, p) {
      if (p.id > n) return;
      if (!p.riding) { const u = w.umbrellas[p.id - 1]; if (!u || !u.alive || u.rider) return; walkTo(p, u.pos); if (dist(p.pos, u.pos) < 1.3) act(w, p, 'interact', u); return; }
      p.goal = dodgeGoal(w, p.riding, true); p.ram = false;
    },
    update(w) {
      collide(w, null);
      const lost = w.umbrellas.filter(u => !u.alive);
      if (lost.length >= 2) fail(w, '兩把傘被摧毀：團滅');
      else if (w.mode === 'play' && lost.some(u => !u.lastRider || u.lastRider.you)) fail(w, '你的傘被摧毀了（再壞一把就團滅）');
    },
  });
}
unbound('unbound', '流雲無定', 'Flowing Clouds Unbound', 4, { b: '1:08', a: '1:03' });

def({
  id: 'halberd', phase: 1, zh: '千機化戟', en: 'Thousand-Machine Halberd',
  brief: 'BOSS 把全員震到場邊並在中央生成風暴；大家要騎傘飛進風暴，並避開「環刃斷傘」。',
  steps: ['BOSS 短暫蓄力後，把所有人震到場邊。', '場中央生成風暴（白色風牆），用走的進不去。', '每人抓一把場邊的傘，騎傘飛進風暴後按「互動」落地。', '千萬不要在風暴外落地，會直接陣亡。', 'BOSS 接著放「環刃斷傘 Ring Blade Umbrella Break」，BOSS 附近的傘會被摧毀，傘要停遠一點。', '盡量把 10 把傘都帶進風暴，後面的機制都要用傘。'],
  fail: '在風暴外落地：陣亡。傘停在 BOSS 旁：被環刃斷傘摧毀，後面傘不夠用。',
  task: '被震飛後走到身邊的傘按 E 上傘，飛進風暴，在離 BOSS 有段距離的地方再按 E 落地。',
  src: { b: '1:41', a: '1:27' },
  setup(w) {
    formation(w, 4);
    at(w, 0.3, () => { cast(w, '千機化戟', 'Thousand-Machine Halberd', 0.3, 2.3); say(w, 'BOSS 蓄力中', '準備被震到場邊'); });
    at(w, 2.3, () => { for (const p of w.players) knockTo(w, p, polar(16.5, angOf(p.pos)), 0.45); });
    at(w, 2.9, () => {
      storm(w);
      w.players.forEach(p => { const u = mkUmb(w, polar(18, angOf(p.pos) + 6)); w.umbrellas.push(u); p.st.umb = u; });
      say(w, '場中央出現風暴', '抓住身邊的傘，騎傘飛進風暴再落地');
      w.bars = [{ label: '風暴內的傘', val: () => w.umbrellas.filter(u => u.alive && len(u.pos) <= w.dome.r).length, max: 10, color: 'gold', fmt: 'n/10' }];
    });
    at(w, 9.5, () => {
      cast(w, '環刃斷傘', 'Ring Blade Umbrella Break', 9.5, 11.7);
      say(w, 'BOSS 施放環刃斷傘', '紅圈內的傘會被摧毀：傘不要停在 BOSS 旁邊');
      tg(w, { kind: 'circle', color: 'red', r: 4.5, c: v(0, 0), t1: 11.7, onHit: (w, t) => { for (const u of w.umbrellas) if (u.alive && inTg(t, u.pos, 0.3)) destroyUmb(w, u); } });
    });
    at(w, 14, () => {
      for (const p of w.players) { if (!p.alive) continue; if (p.riding) dismount(w, p); if (len(p.pos) > w.dome.r) kill(w, p, '沒有進入風暴'); }

def({
  id: 'dragon', phase: 1, zh: '神機化龍', en: 'Divine Machine Dragon',
  brief: '被點名的人會被分身跳砸兩次：一次躲傘下抵銷，一次自己硬吃。',
  steps: ['（風暴內，接下來大部分招式都會放兩次）BOSS 隨機點名玩家，腳下出現金圈。', '分身會對被點名的人跳砸兩次，被打中兩次會直接陣亡。', '其中一次躲到傘的正下方，用傘抵銷（傘會被摧毀）。', '另一次直接用身體硬吃。', '目的是保留更多傘給後面的機制，所以不要兩次都用傘。'],
  fail: '被打中兩次：陣亡。兩次都用傘：浪費一把傘。',
  task: '你被點名：第一下站著硬吃，之後走到最近的傘的正下方擋第二下。',
  src: { b: '2:24', a: '1:57' },
  setup(w) {
    storm(w); parkRing(w, 8, 7, -67.5); formation(w, 3.5);
    at(w, 0.3, () => {
      cast(w, '神機化龍', 'Divine Machine Dragon', 0.3, 2.3);
      for (const p of [P(w, 1), P(w, 6)]) { mark(w, p); p.st.marked = true; }
      say(w, '1 號（你）和 6 號被點名', '分身會跳砸兩次：一次躲傘下抵銷，一次硬吃');
    });
    for (const [t0, t1] of [[3.3, 4.8], [6.8, 8.3]]) at(w, t0, () => {
      for (const p of [P(w, 1), P(w, 6)]) if (p.alive) tg(w, { kind: 'circle', color: 'gold', r: 2, follow: p, t0, t1, onHit: () => dragonHit(w, p) });
    });
    at(w, 5.2, () => say(w, '第一下硬吃了', '第二下之前躲到傘的正下方'));
    at(w, 9.5, () => {
      if (P(w, 1).hits === 0) win(w, '兩下都用傘擋掉：活下來了，但多用掉一把傘');
      else win(w, '一下硬吃、一下用傘抵銷，成功保住更多傘！');
    });
  },
  ai(w, p) {
    if (!p.st.marked) return;
    if (w.t < 4.9) { walkTo(p, p.home); return; }
    if (!p.st.u || !p.st.u.alive) p.st.u = nearestFree(w, p.pos, p);
    if (p.st.u) walkTo(p, p.st.u.pos);
  },
});
function dragonHit(w, p) {
  if (!p.alive) return;
  w.fx.push({ kind: 'ghost', at: cp(p.pos), t: w.t, life: 0.8 });
  const u = shelter(w, p);
  if (u) { destroyUmb(w, u); if (p.you) note(w, '傘抵銷了這次攻擊（傘被摧毀）'); return; }
  p.hits++; p.hp -= 45;
  if (p.hits >= 2) kill(w, p, '被分身打中兩次');
  else if (p.you) note(w, '硬吃一下：再被打中就會死');
}

def({
  id: 'swan', phase: 1, zh: '孤鴻掠雪', en: 'Lone Swan Sweeping Snow',
  brief: '承傷者腳下出現金圈，讀條結束時 BOSS 會到他身邊擊退全場；別被擊出風暴。',
  steps: ['（風暴內）承傷隊員腳下出現金圈。', '讀條結束時，BOSS 會移動到承傷者旁邊，對全體擊退。', '承傷者在讀條結束前，先站到風暴內的邊緣。', '其他人靠近 BOSS、站在承傷者的內側（靠場中央那邊），擊退方向才會朝內。', '也可以用「神龍吐火」的強韌效果，或三段跳到空中躲掉擊退。'],
  fail: '被擊退到風暴外：陣亡。',
  task: '你是承傷者：讀條結束前走到風暴內緣（白色風牆旁），隊友會站在你的內側。也可以在擊退瞬間按空白鍵跳起來。',
  src: { b: '2:50', a: '2:18' },
  setup(w) {
    storm(w); formation(w, 3);
    at(w, 0.3, () => {
      cast(w, '孤鴻掠雪', 'Lone Swan Sweeping Snow', 0.3, 6.3); mark(w, P(w, 1));
      say(w, '你被點名為承傷者', '走到風暴內緣；其他人會站在你的內側');
      w.markers = [{ c: polar(8.6, -90), label: '建議位置' }];
    });
    at(w, 6.3, () => swanHit(w));
    at(w, 7.4, () => {
      if (!P(w, 1).alive) return;
      const dead = w.players.filter(p => !p.alive).length;
      if (dead) fail(w, `${dead} 名隊友被擊出風暴：承傷者要站在風暴內緣，讓 BOSS 從外側把大家往內推`);
      else win(w, '全員被擊退到風暴內側，安全！');
    });
  },
  ai(w, p) {
    const T = P(w, 1);
    if (p.id === 1) { walkTo(p, polar(8.6, -90)); return; }
    if (w.t < 0.8) return;
    const out = len(T.pos) > 0.5 ? norm(T.pos) : v(0, 1), k = p.id - 2;
    walkTo(p, add(sub(T.pos, mul(out, 2.5 + Math.floor(k / 3) * 1.3)), mul(perp(out), (k % 3 - 1) * 1.4)));
  },
});
function swanHit(w) {
  const T = P(w, 1);
  let b = add(T.pos, mul(len(T.pos) > 0.3 ? norm(T.pos) : v(0, 1), 1.6));
  if (len(b) > 9.6) b = mul(norm(b), 9.6);
  w.boss.pos = b;
  w.fx.push({ kind: 'flash', shape: { kind: 'circle', c: cp(b), r: 13 }, color: 'gold', t: w.t, life: 0.6 });
  for (const p of w.players) {
    if (!p.alive) continue;
    if (p.y > 0.4) { if (p.you) note(w, '跳起來躲過擊退！'); continue; }
    const d = sub(p.pos, b), n = len(d) > 0.2 ? norm(d) : norm(mul(b, -1));
    knockTo(w, p, add(p.pos, mul(n, 8)), 0.4);
  }
}

function spine(id, zh, en, B, src) {
  def({
    id, phase: 1, zh, en,
    brief: B ? '和第一次「龍脊碎岳」完全相同，但改由第二組（沒有力竭的人）卸勢。' : 'BOSS 上金盾，場中央出現紅圈：紅圈內要放一把傘，並至少三人卸勢。',
    steps: B
      ? ['機制和第一次「龍脊碎岳」完全相同。', '第一次卸勢成功的人身上有「力竭」，短時間內不能再卸勢。', '這次換第二組上去：紅圈內一把傘＋至少三人在紅圈內卸勢。', '建議開打前就照隊伍列表分兩組輪流。']
      : ['（風暴內）BOSS 為自己套上金色護盾並開始讀秒。', '場中央出現紅圈（位置固定，可以提前把傘放好）。', '紅圈內放一把傘，傘可以削減 BOSS 護盾。', '至少三名隊員站在紅圈內，在讀條結束時「卸勢」。', '卸勢成功的人會被掛上「力竭」，下一次換另一組。'],
    fail: '紅圈內沒有傘，或卸勢的人少於三人：團滅。',
    task: '你負責卸勢：走進紅圈，看著上方讀條，在綠色區段（最後 0.7 秒）按 Q。',
    src,
    setup(w) {
      storm(w); parkRing(w, 8, 7.5, -67.5); formation(w, 6); w.boss.shield = 1;
      w.f.def = B ? [1, 6, 7] : [1, 2, 3]; w.f.car = B ? 5 : 4;
      if (B) [2, 3, 4].forEach(i => { P(w, i).exhausted = true; });
      at(w, 0.3, () => {
        cast(w, zh, en, 0.3, 9.3, true);
        tg(w, { kind: 'circle', color: 'red', r: 3.2, c: v(0, 0), t1: 9.3, onHit: spineResolve });
        say(w, 'BOSS 上金盾並讀秒，場中央出現紅圈', B ? '有「力竭」的人不能卸勢，換第二組上' : '紅圈內放一把傘，至少三人在紅圈內卸勢');
      });
      at(w, 6.5, () => say(w, '準備卸勢', '讀條進入綠色區段時按「卸勢」（Q）'));
    },
    ai(w, p) {
      if (p.id === w.f.car) { if (!p.st.u) p.st.u = nearestFree(w, p.pos, p); umbTask(w, p, p.st.u, polar(2, 60)); return; }
      const i = w.f.def.indexOf(p.id); if (i < 0) return;
      walkTo(p, polar(2.3, [-90, -30, -150][i]));
      if (w.t >= 9.3 - 0.3 && !p.st.d) { p.st.d = true; act(w, p, 'deflect'); }
    },
  });
}
function spineResolve(w) {
  const umb = w.umbrellas.some(u => u.alive && !u.rider && len(u.pos) <= 3.4);
  const ok = w.players.filter(p => p.alive && len(p.pos) <= 3.5 && !p.exhausted && !p.electrified && w.t - p.deflectT <= DEFLECT_WIN + 0.02 && w.t >= p.deflectT);
  if (!umb) return fail(w, '紅圈內沒有傘：團滅');
  if (ok.length < 3) return fail(w, `只有 ${ok.length} 人成功卸勢（至少要 3 人）：團滅` + (w.mode === 'play' && !ok.includes(P(w, 1)) ? '。你沒有在綠色區段內按卸勢' : ''));
  ok.forEach(p => { p.exhausted = true; });
  w.boss.shield = 0;
  win(w, `${ok.length} 人卸勢成功，紅圈內也有傘：擋下攻擊！`);
}
spine('spine', '龍脊碎岳', 'Dragon Spine Shattering Mountains', false, { b: '3:23', a: '2:48' });

def({
  id: 'spine-break', phase: 1, zh: '龍脊碎岳．破', en: 'Dragon Spine Shattering Mountains – Break',
  brief: '風暴內出現兩個固定金圈，提前把傘移進金圈，擋下分身攻擊。',
  steps: ['（風暴內）出現兩個金圈，位置固定。', '騎傘把傘移進金圈裡，按「互動」落地停好；有傘的金圈會變綠。', '讀條結束時兩個金圈都要有傘，才能擋下 BOSS 分身的攻擊。', '這招之後還會再出一次，金圈位置一樣，可以提前準備。'],
  fail: '金圈內沒有傘：全隊被附加易傷（最多疊 4 層）。',
  task: '騎一把傘飛到左邊的金圈裡，按 E 落地停好（另一個金圈由隊友負責）。',
  src: { b: '3:58', a: '3:15' },
  setup(w) {
    storm(w); parkRing(w, 8, 7.5, -67.5); formation(w, 5);
    const C = w.f.C = [polar(4.5, 225), polar(4.5, 315)];
    at(w, 0.3, () => {
      cast(w, '龍脊碎岳．破', 'Dragon Spine Shattering Mountains – Break', 0.3, 10.3);
      w.f.tgs = C.map(c => tg(w, { kind: 'circle', color: 'gold', r: 2, c, t1: 10.3, onHit: (w, t) => {
        const u = w.umbrellas.find(u => u.alive && !u.rider && inTg(t, u.pos));
        if (u) destroyUmb(w, u); else w.f.miss = (w.f.miss || 0) + 1;
      } }));
      say(w, '風暴內出現兩個固定金圈', '把傘移進金圈並停好（金圈變綠就成功）');
    });
    at(w, 10.45, () => { if (w.f.miss) fail(w, `${w.f.miss} 個金圈沒有傘：全隊易傷`); else win(w, '兩個金圈都有傘，擋下分身攻擊！'); });
  },
  ai(w, p) {
    const C = w.f.C; if (!w.f.tgs) return;
    if (p.id === 1) { if (!p.st.u) p.st.u = nearestFree(w, C[0], p); umbTask(w, p, p.st.u, C[0]); }
    if (p.id === 2) {
      const you = P(w, 1), yu = you.riding;
      const tgt = w.mode === 'play' && yu && dist(yu.pos, C[1]) < dist(yu.pos, C[0]) ? C[0] : C[1];
      if (!p.st.u) p.st.u = nearestFree(w, C[1], p);
      umbTask(w, p, p.st.u, tgt);
    }
  },
  update(w) { for (const t of (w.f.tgs || [])) t.color = w.umbrellas.some(u => u.alive && !u.rider && inTg(t, u.pos)) ? 'green' : 'gold'; },
});

spine('spine-x', '龍脊碎岳．極', 'Dragon Spine Shattering Mountains – Extreme', true, { b: '4:20', a: '3:42' });

def({
  id: 'umbrella-break', phase: 1, zh: '千機化傘．破', en: 'Thousand-Machine Umbrella – Break',
  brief: '和「千機化傘」一樣生成兩把傘，但多一個追人的分身；要在分身旁邊撞傘。',

  fail: '分身碰到目標：目標被秒殺。',
  task: '騎上一把傘飛到分身旁邊；隊友會從另一側衝過來和你對撞（撞擊點要在分身旁）。',
  src: { b: '4:41', a: '4:42' },
  setup(w) {
    formation(w, 6);
    at(w, 0.3, () => { cast(w, '千機化傘．破', 'Thousand-Machine Umbrella – Break', 0.3, 2); say(w, 'BOSS 召喚兩把傘和一個分身', '分身會追 8 號，追到就秒殺'); });
    at(w, 2, () => {
      w.umbrellas.push(mkUmb(w, polar(3.6, -60)), mkUmb(w, polar(3.6, -120)));
      w.clone = { pos: v(0, 0), target: P(w, 8), speed: 1.5, hp: 100, broken: false, dead: false };
      mark(w, P(w, 8), 'red', 1.2);
    });
    at(w, 3.2, () => say(w, '兩人騎傘，在分身旁邊對撞', '撞擊點離分身太遠就沒有效果'));
    at(w, 30, () => fail(w, '分身沒有被處理：目標被秒殺'));
  },
  ai(w, p) {
    const c = w.clone;
    if (p.id === 8) { walkTo(p, polar(17, 162)); return; }
    if (!c || p.id > 2 || w.umbrellas.length < 2) return;
    const other = ramAI(w, p, [1, 2]); if (!other) return;
    if (c.broken) { p.goal = null; return; }
    const side = perp(norm(sub(c.target.pos, c.pos))), you = P(w, 1);
    if (w.mode === 'demo') {
      const sg = p.id === 1 ? 1 : -1, stage = add(c.pos, mul(side, sg * 5));
      if (!w.f.ram) {
        p.goal = stage; p.ram = false;
        if (!w.f.stageT && other.rider) w.f.stageT = w.t;
        const ready = other.rider && dist(p.riding.pos, stage) < 1 && dist(other.pos, add(c.pos, mul(side, -sg * 5))) < 1;
        if (ready || (w.f.stageT && w.t - w.f.stageT > 5)) w.f.ram = true;
      } else { p.goal = cp(other.pos); p.ram = true; }
    } else if (you.riding && dist(you.riding.pos, c.pos) < 6.5) { p.goal = cp(you.riding.pos); p.ram = true; }
    else { p.goal = add(c.pos, mul(you.riding ? norm(sub(c.pos, you.riding.pos)) : side, 5)); p.ram = false; }
  },
  update(w, dt) {
    const c = w.clone; if (!c || c.dead) return;
    if (!c.broken) {
      const d = sub(c.target.pos, c.pos), L = len(d);
      if (L < 1.2) { kill(w, c.target, '被分身秒殺'); return fail(w, '分身追到 8 號：秒殺'); }
      c.pos = add(c.pos, mul(d, Math.min(c.speed * dt, L) / L));
      collide(w, (pt, a, b, cl) => {
        if (cl < 3) return note(w, '撞得太慢沒有效果');
        if (dist(pt, c.pos) < 3.5) { c.broken = true; say(w, '分身進入「氣竭」！', '全隊集火把它打掉'); }
        else { note(w, '撞擊點離分身太遠，沒有效果'); w.f.ram = false; w.f.stageT = w.t; }
      });
    } else {
      collide(w, null);
      c.hp -= 40 * dt;
      if (c.hp <= 0) { c.dead = true; win(w, '分身被擊破，機制化解！'); }
    }
  },
});

def({
  id: 'cage', phase: 2, zh: '牢籠．黜 / 牢籠．浮', en: 'Cage – Banish / Cage – Float',
  brief: '隊友被關進牢籠；兩人拿雷電球取得「感電」，用兩人之間的雷電連線碰牢籠救人。',
  steps: ['BOSS 隨機點名一名隊員，把他困在無法靠近的力場（牢籠）裡。', '另外兩名隊員去碰場邊的雷電球，取得「感電」。', '兩個感電的人靠近時會自動連出一條雷電。', '移動站位，讓雷電連線穿過牢籠，就能把人救出來。', '「黜」把人困在地面；「浮」困在空中，兩人要同時跳起來讓連線碰到牢籠。'],
  fail: '時間內沒救出來：被困的隊友陣亡。',
  task: '走到雷電球旁按 E 取得感電，再站到牢籠旁，讓你和隊友的連線穿過牢籠。空中牢籠要按空白鍵跳（隊友會跟著跳）。',
  src: { b: '5:53', a: '5:45' },
  setup(w) {
    formation(w, 6); w.f.resc = [1, 3]; P(w, 1).st.orb = w.orbs[1]; P(w, 3).st.orb = w.orbs[2];
    at(w, 0.3, () => { cast(w, '牢籠．黜', 'Cage – Banish', 0.3, 2.3); w.f.m = mark(w, P(w, 5)); say(w, 'BOSS 點名 5 號', '兩人去碰雷電球取得「感電」'); });
    at(w, 2.3, () => {
      removeTg(w, w.f.m); w.f.cage = makeCage(w, P(w, 5), P(w, 5).pos, false); w.f.stage = 1; w.f.dl = w.t + 16;
      say(w, '5 號被關進地面牢籠', '讓兩人之間的雷電連線穿過牢籠');
      w.bars = [{ label: '救援倒數', val: () => Math.max(0, w.f.dl - w.t), max: 16, color: 'red', fmt: 's' }];
    });
  },
  ai(w, p) {
    if (!w.f.resc.includes(p.id)) return;
    if (!p.electrified) { orbTask(w, p); return; }
    const cg = w.f.cage; if (!cg) return;
    let axis;
    if (w.mode === 'demo') {
      if (w.f.axisFor !== cg) { w.f.axis = norm(sub(P(w, 1).pos, cg.c)); w.f.axisFor = cg; }
      axis = p.id === 1 ? w.f.axis : mul(w.f.axis, -1);
    } else {
      const you = P(w, 1);
      axis = you.electrified ? norm(sub(cg.c, you.pos)) : norm(sub(p.pos, cg.c));
    }
    walkTo(p, add(cg.c, mul(axis, 4)));
    if (cg.y > 0 && w.mode === 'demo' && p.id === 1) {
      const a = P(w, 1), b = P(w, 3);
      const ready = b.electrified && dist(a.pos, add(cg.c, mul(w.f.axis, 4))) < 0.6 && dist(b.pos, add(cg.c, mul(w.f.axis, -4))) < 0.6 && a.y === 0 && b.y === 0;
      if (!ready) w.f.readyT = null; else if (!w.f.readyT) w.f.readyT = w.t;
      if (ready && w.t - w.f.readyT > 0.8 && w.t - (w.f.jt || -9) > 1.3) { w.f.jt = w.t; act(w, a, 'jump'); act(w, b, 'jump'); }
    }
  },
  onJump(w, p) { if (w.mode === 'play' && p.you) { const q = P(w, 3); if (q.electrified && q.alive) act(w, q, 'jump'); } },
  update(w) {
    const cg = w.f.cage; if (!cg) return;
    if (cageTouched(w, cg)) {
      freeCage(w, cg); w.f.cage = null;
      if (w.f.stage === 1) {
        say(w, '救出 5 號！', '下一招：牢籠．浮');
        at(w, w.t + 1.2, () => { cast(w, '牢籠．浮', 'Cage – Float', w.t, w.t + 2); w.f.m = mark(w, P(w, 9)); say(w, 'BOSS 點名 9 號', '這次牢籠會浮在空中'); });
        at(w, w.t + 3.2, () => { removeTg(w, w.f.m); w.f.cage = makeCage(w, P(w, 9), P(w, 9).pos, true); w.f.stage = 2; w.f.dl = w.t + 16; say(w, '9 號被關進空中牢籠', '兩人站好後一起跳，讓連線碰到空中的牢籠'); });
      } else win(w, '兩個牢籠都救出來了！');
      return;
    }
    if (w.t > w.f.dl) { kill(w, cg.p, '困在牢籠裡'); fail(w, '沒有及時救出隊友'); }
  },
});

def({
  id: 'slash', phase: 2, zh: '電斬．徑 / 電斬．扇', en: 'Lightning Slash – Path / Fan',
  brief: '救完人後緊接的直線、扇形紅光；身上有感電不能卸勢，只能閃。',
  steps: ['「牢籠」結束後，BOSS 接著放「電斬．徑」（直線紅光）和「電斬．扇」（扇形紅光）。', '身上還有「感電」的人不能卸勢。', '這些紅光傷害高，又帶控場效果，能閃就閃，不要硬接。'],
  fail: '被紅光打中：高傷害＋被控場。',
  task: '你身上有感電，無法卸勢：看到直線或扇形紅光就往側邊走出去。',
  src: { b: '6:23' },
  setup(w) {
    formation(w, 7);
    const you = P(w, 1); you.electrified = true; you.orb = w.orbs[1]; w.orbs[1].holder = you;
    at(w, 0.3, () => {
      cast(w, '電斬．徑', 'Lightning Slash – Path', 0.3, 2.3);
      for (const id of [1, 3, 7, 9]) tg(w, { kind: 'rect', color: 'red', c: v(0, 0), a: angOf(P(w, id).pos), len: 20, w: 3.2, t1: 2.3, onHit: slashHit });
      say(w, '直線紅光朝玩家打過來', '感電中不能卸勢：往側邊閃');
    });
    at(w, 2.7, () => {
      cast(w, '電斬．扇', 'Lightning Slash – Fan', 2.7, 4.7);
      for (const id of [1, 6]) tg(w, { kind: 'sector', color: 'red', c: v(0, 0), a: angOf(P(w, id).pos), half: 35, r: 19, t1: 4.7, onHit: slashHit });
      say(w, '接著是扇形紅光', '繞到扇形外面');
    });
    at(w, 5.6, () => win(w, '成功閃過所有紅光！'));

  ai(w, p) { p.goal = dodgeGoal(w, p, false); p.ram = false; },
});
function slashHit(w, t) {
  for (const p of w.players) if (p.alive && !p.cage && inTg(t, p.pos, 0.3)) {
    p.hp -= 50; w.fx.push({ kind: 'hit', at: cp(p.pos), t: w.t, life: 0.4 });
    if (p.you) fail(w, '被紅光擊中：高傷害並被控場');
  }
}

def({
  id: 'compass', phase: 2, zh: '司南．黜', en: 'Compass – Banish',
  brief: '三人被點名，讀條結束落下飛劍並留下永久力場；被點名的人跑到場邊集中，別放在雷電球旁。',
  steps: ['BOSS 隨機點名三名玩家，腳下出現金圈。', '讀條結束後，在他們的位置落下飛劍，降低全隊攻擊力，並留下永久力場（靠近會被彈開）。', '被點名的三人第一時間跑到場地邊緣，盡量集中站在一起。', '千萬不要把力場放在雷電球旁邊，不然之後拿不到感電。', '遠程隊員負責把飛劍打掉，解除攻擊力降低。'],
  fail: '力場蓋在雷電球旁：之後拿不到感電。力場留在場中：擋住隊伍走位。',
  task: '你被點名：讀條結束前跑到場邊的集合點（兩顆雷電球中間），和其他被點名的人站在一起。',
  src: { b: '6:58', a: '6:33' },
  setup(w) {
    formation(w, 6);
    const M = w.f.M = [1, 4, 7], G = w.f.G = polar(17, 270);
    at(w, 0.3, () => {
      cast(w, '司南．黜', 'Compass – Banish', 0.3, 6.3);
      M.forEach(i => mark(w, P(w, i), 'gold', 2.2));
      say(w, '1、4、7 號被點名', '跑到場邊集中，遠離雷電球');
      w.markers = [{ c: G, label: '集合點' }];
    });
    at(w, 6.3, () => {
      w.tgs = w.tgs.filter(t => !t.mark);
      for (const i of M) { const q = P(w, i); if (!q.alive) continue; w.swords.push({ c: cp(q.pos), hp: 100, max: 100 }); w.fields.push({ c: cp(q.pos), r: 3, owner: null, kind: 'compass' }); }
      say(w, '飛劍落下，留下永久力場', '遠程隊員把飛劍打掉');
      w.bars = [{ label: '全隊攻擊力', val: () => (w.swords.some(s => s.hp > 0) ? 70 : 100), max: 100, color: 'red', fmt: '%' }];
      const yp = P(w, 1).pos, orbD = Math.min(...w.orbs.map(o => dist(o.pos, yp)));
      if (orbD < 6) return fail(w, '你的力場蓋在雷電球旁邊：之後沒辦法進去拿感電');
      if (len(yp) < 13.5) return fail(w, '你的力場留在場地中間：會擋住隊伍走位，要跑到場邊');
      w.f.grouped = [4, 7].every(i => dist(P(w, i).pos, yp) < 6);
    });
  },
  ai(w, p) {
    const k = w.f.M.indexOf(p.id); if (k < 0 || w.t < 0.35 || w.swords.length) return;
    walkTo(p, add(w.f.G, mul(perp(norm(w.f.G)), (k - 1) * 1.6)));
  },
  update(w, dt) {
    if (!w.swords.length) return;
    for (const s of w.swords) s.hp = Math.max(0, s.hp - 30 * dt);
    if (w.swords.every(s => s.hp <= 0)) win(w, w.f.grouped ? '力場都集中在場邊，飛劍也打掉了！' : '力場在場邊，飛劍打掉了（下次可以和其他被點名的人站近一點）');
  },
});

function rangedSetup(w) {
  w.f.R = [1, 6, 7];
  P(w, 1).st.orb = w.orbs[2]; P(w, 6).st.orb = w.orbs[1]; P(w, 7).st.orb = w.orbs[0];
}
const vertexOf = p => polar(9, angOf(p.orb.pos));

def({
  id: 'pull', phase: 2, zh: '萬磁天引', en: 'Universal Magnetic Pull',
  brief: '鵬的大絕：三名高輸出遠程拿感電，在 BOSS 外圍拉成三角形，減緩充能並在時間內破盾。',
  steps: ['BOSS 回到場中央開始充能，並套上護盾。', '派三名高輸出的遠程去碰雷電球，取得「感電」。', '三人以三角形站位把 BOSS 圍在中間，三條雷電連線會減緩 BOSS 充能。', '連線千萬不能碰到中間的近戰隊友，否則隊友受傷、BOSS 回盾。', '站開一點但別退太遠（連線有長度上限，也會吃不到補師群補），大約離 BOSS 9 公尺。', '感電的三人會得到大量增傷：在充能完成前打破護盾。'],
  fail: '充能完成前沒打破護盾：團滅。',
  task: '你是三名遠程之一：拿一顆雷電球的感電，站到你那一側的建議位置（離 BOSS 約 9 公尺）。',
  src: { b: '7:33', a: '6:57' },
  setup(w) {
    formation(w, 6); rangedSetup(w);
    at(w, 0.3, () => {
      cast(w, '萬磁天引', 'Universal Magnetic Pull', 0.3, null); w.cast.prog = () => (w.f.charge || 0) / 100;
      w.boss.shield = 220; w.f.charge = 0; w.f.on = true;
      say(w, 'BOSS 回到場中央充能', '三名遠程去拿感電，圍成三角形');
      w.markers = [90, 210, 330].map(a => ({ c: polar(9, a), label: '遠程站位' }));
      w.bars = [{ label: 'BOSS 護盾', val: () => w.boss.shield, max: 220, color: 'gold', fmt: 'int' }, { label: '大招充能', val: () => w.f.charge, max: 100, color: 'red', fmt: '%' }];
    });
  },
  ai(w, p) {
    if (!w.f.on) return;
    if (w.f.R.includes(p.id)) { if (!p.electrified) orbTask(w, p); else walkTo(p, vertexOf(p)); return; }
    walkTo(p, polar(1.9, angOf(p.home)));
  },
  update(w, dt) {
    if (!w.f.on) return;
    const tri = w.tethers.length === 3;
    w.f.charge += (tri ? 2.5 : 5.2) * dt;
    let dps = 0;
    for (const p of w.players) if (p.alive) dps += p.electrified ? (tri ? 3.5 : 1.5) : 0.9;
    for (const t of w.tethers) for (const p of w.players) {
      if (!p.alive || p.electrified || segInfo(p.pos, t.a.pos, t.b.pos).d >= 0.9) continue;
      w.boss.shield = Math.min(220, w.boss.shield + 14 * dt); p.hp -= 10 * dt;
      if (!w.f.warn || w.t - w.f.warn > 2) { w.f.warn = w.t; note(w, `雷電連線碰到 ${p.id} 號隊友：BOSS 回盾！`); }
    }
    w.boss.shield -= dps * dt;
    if (w.boss.shield <= 0) { w.boss.shield = 0; w.f.on = false; win(w, '護盾打破！成功化解萬磁天引'); }
    else if (w.f.charge >= 100) fail(w, '充能完成：團滅' + (tri ? '' : '。三角形連線沒拉起來，充能沒有被減速'));
  },
});

  brief: '吸人＋金圈爆炸，接著四把司南劍要在 5 秒內一起擊破，最後連續五次全場金圈要靠補師群補撐過。',

    if (!live()) return;
    const p = VIEW.pick(e.clientX, e.clientY);
    if (p) { input.click = p; world.fx.push({ kind: 'deflect', at: p, t: world.t, life: 0.35, click: true }); }
  });
  $('touch').addEventListener('pointerdown', e => { const b = e.target.closest('button[data-a]'); if (!b) return; e.preventDefault(); if (live()) input.actions.push(b.dataset.a); });

  let lastHud = {};
  const setText = (el, key, val) => { if (lastHud[key] !== val) { lastHud[key] = val; el.textContent = val; } };
  const setHTML = (el, key, val) => { if (lastHud[key] !== val) { lastHud[key] = val; el.innerHTML = val; } };
  const COLV = { red: 'var(--hud-red)', gold: 'var(--hud-gold)', jade: 'var(--hud-jade)' };
  function fmtBar(b, val) {
    if (b.fmt === 's') return val.toFixed(1) + ' 秒';
    if (b.fmt === '%') return Math.round(val) + '%';
    if (b.fmt === 'int') return String(Math.round(val));
    if (b.fmt && b.fmt.startsWith('n/')) return `${Math.round(val)}/${b.fmt.slice(2)}`;
    return String(Math.round(val));
  }
  function hud() {
    const w = world; if (!w) return;
    const c = w.cast;
    $('cast').hidden = !c;
    if (c) {
      setText($('castZh'), 'czh', c.zh); setText($('castEn'), 'cen', c.en);
      const p = c.prog ? c.prog() : Math.max(0, Math.min(1, (w.t - c.t0) / (c.t1 - c.t0)));
      $('castFill').style.width = (p * 100).toFixed(1) + '%';
      $('castZone').hidden = !c.deflect;
      if (c.deflect) $('castZone').style.width = (SIM.DEFLECT_WIN / (c.t1 - c.t0) * 100).toFixed(1) + '%';
    }
    setHTML($('bars'), 'bars', w.bars.map(b => { const val = Math.max(0, b.val()); return `<div class="bar"><header><span>${b.label}</span><b>${fmtBar(b, val)}</b></header><div class="track"><i style="width:${Math.min(100, val / b.max * 100).toFixed(1)}%;background:${COLV[b.color] || COLV.gold}"></i></div></div>`; }).join(''));
    setText($('clock'), 'clk', w.t.toFixed(1) + ' 秒');
    const you = w.players[0], ch = [];
    if (!you.alive) ch.push('<span class="warn">倒地</span>');
    if (you.riding) ch.push('<span>騎傘中</span>');
    if (you.electrified) ch.push('<span class="zap">感電</span>');
    if (you.exhausted) ch.push('<span class="warn">力竭</span>');
    if (you.cage) ch.push('<span class="warn">被困</span>');
    if (w.tgs.some(t => t.mark && t.follow === you)) ch.push('<span class="warn">被點名</span>');
    if (you.y > 0.05) ch.push('<span>空中</span>');
    if (you.hp < 100 && you.alive) ch.push(`<span>HP ${Math.max(0, Math.round(you.hp))}</span>`);
    setHTML($('chips'), 'chips', ch.join(''));
    const cap = w.caption;
    $('caption').hidden = !cap;
    if (cap) { setText($('capSay'), 'say', cap.text); setText($('capTip'), 'tip', cap.tip ? '提示：' + cap.tip : ''); }
    const msg = w.msg && w.t - w.msg.t < 2.2 ? w.msg.text : '';
    $('toast').hidden = !msg; setText($('toast'), 'toast', msg);
    if (w.result && !shown && w.t - w.result.t >= 0) {
      shown = true;
      setTimeout(() => {
        if (world !== w) return;
        const r = w.result, t = $('resTitle');
        t.textContent = r.ok ? '成功' : '失敗'; t.className = r.ok ? 'ok' : 'bad';
        $('resText').textContent = r.text;
        $('resPlay').textContent = mode === 'play' ? '再操作一次' : '實際操作';
        $('resRetry').hidden = mode === 'play';
        $('resDemo').textContent = mode === 'demo' ? '重看示範' : '看示範';
        $('resRetry').textContent = '再試一次';
        $('result').hidden = false;
      }, 700);
    }
  }

  if (!VIEW.init(stage)) return;
  let saved = null; try { saved = localStorage.getItem('hc-sim-mech'); } catch (e) {}
  choose(M.some(m => m.id === saved) ? saved : M[0].id, 'demo');

  let last = performance.now(), acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    const real = Math.min(0.1, (now - last) / 1000); last = now;
    if (world && !paused) {
      acc += real * speed;
      let n = 0;
      while (acc >= STEP && n < 12) { input.dir = mode === 'play' ? keyDir() : null; SIM.step(world, STEP, input); acc -= STEP; n++; }
      if (n === 12) acc = 0;
    }
    VIEW.sync(world, paused ? 0 : real * speed);
    hud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
